name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent the Render free tier from sleeping (it sleeps after 15 mins of inactivity)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: curl -f https://memory-firewall-api.onrender.com/health || echo "Ping failed, but continuing..."
