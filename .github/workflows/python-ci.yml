name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx sentence-transformers

    - name: Run test suite
      run: |
        python -m pytest apps/api/tests/ -v

    - name: Run benchmark smoke test
      run: |
        python -m pytest apps/api/tests/test_benchmark_smoke.py -v

    - name: Verify package installation
      run: |
        pip install .
        python -c "import packages.client; import packages.connectors; import packages.cli"
        python -m packages.cli.main --version
