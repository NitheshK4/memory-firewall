<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040814" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradient Fills -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    /* CSS Styles and Keyframes */
    .title-text {
      font-family: 'Outfit', 'Inter', 'Segoe UI', sans-serif;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: 5px;
      font-size: 24px;
      filter: drop-shadow(0 2px 8px rgba(0, 242, 254, 0.4));
    }
    .subtitle-text {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-weight: 500;
      fill: #64748b;
      letter-spacing: 2px;
      font-size: 11px;
    }
    .node-label {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-weight: 600;
      font-size: 10px;
      fill: #94a3b8;
    }
    .status-label {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-weight: 700;
      font-size: 11px;
    }
    .pulse-shield {
      animation: shieldPulse 3s infinite ease-in-out;
      transform-origin: 400px 175px;
    }
    .scan-line {
      animation: laserScan 4s infinite ease-in-out;
    }
    .grid-lines {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.25;
    }
    .connection-line {
      stroke: #1e293b;
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }

    /* Keyframes */
    @keyframes shieldPulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4));
        opacity: 0.9;
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.8));
        opacity: 1;
      }
    }
    @keyframes laserScan {
      0%, 100% {
        transform: translateY(-30px);
        opacity: 0.2;
      }
      50% {
        transform: translateY(35px);
        opacity: 1;
      }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="300" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Grid -->
  <g class="grid-lines">
    <line x1="50" y1="0" x2="50" y2="300" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="250" y1="0" x2="250" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="350" y1="0" x2="350" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="550" y1="0" x2="550" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="655" y1="0" x2="655" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
    
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
  </g>

  <!-- Titles -->
  <text x="400" y="42" text-anchor="middle" class="title-text">MEMORY FIREWALL</text>
  <text x="400" y="60" text-anchor="middle" class="subtitle-text">SECURE GATEWAY FOR LLM AGENT MEMORY SYSTEMS</text>

  <!-- Connection Paths (Dashed Lines) -->
  <!-- Left to Firewall -->
  <path id="path-src1-fw" d="M 150 115 L 400 175" class="connection-line" />
  <path id="path-src2-fw" d="M 150 175 L 400 175" class="connection-line" />
  <path id="path-src3-fw" d="M 150 235 L 400 175" class="connection-line" />

  <!-- Firewall to Right Destinations -->
  <path id="path-fw-store" d="M 400 175 L 650 115" class="connection-line" />
  <path id="path-fw-quar" d="M 400 175 L 650 235" class="connection-line" />

  <!-- ================= LEFT: UNTRUSTED SOURCES ================= -->
  <!-- Source 1: Web Scraper / Low Authority -->
  <g transform="translate(150, 115)">
    <circle r="22" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Web/Globe Icon -->
    <path d="M-8,0 A8,8 0 1,0 8,0 A8,8 0 1,0 -8,0 M-8,0 L8,0 M0,-8 L0,8 M-5.6,-5.6 C-2,-2 -2,2 -5.6,5.6 M5.6,-5.6 C2,-2 2,2 5.6,5.6" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="-35" y="4" text-anchor="end" class="node-label">Web Scraper</text>
  </g>

  <!-- Source 2: External Emails / Messages -->
  <g transform="translate(150, 175)">
    <circle r="22" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Envelope Icon -->
    <rect x="-8" y="-6" width="16" height="12" rx="1.5" fill="none" stroke="#64748b" stroke-width="1.5" />
    <path d="M-8,-6 L0,1 L8,-6" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="-35" y="4" text-anchor="end" class="node-label">Untrusted Email</text>
  </g>

  <!-- Source 3: Tool / API Execution -->
  <g transform="translate(150, 235)">
    <circle r="22" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <!-- Gear Icon -->
    <path d="M-4,-4 L-3,-7 L-1,-7 L0,-4 L2,-4 L3,-7 L5,-7 L4,-4 L6,-2 L9,-3 L9,-1 L6,0 L6,2 L9,3 L9,5 L6,6 L4,4 L3,7 L1,7 L0,4 L-2,4 L-3,7 L-5,7 L-4,4 L-6,2 L-9,3 L-9,1 L-6,0 L-6,-2 L-9,-3 L-9,-5 L-6,-6 Z" fill="none" stroke="#64748b" stroke-width="1.5" />
    <circle r="3" fill="none" stroke="#64748b" stroke-width="1.5" />
    <text x="-35" y="4" text-anchor="end" class="node-label">Tool Output</text>
  </g>


  <!-- ================= CENTER: FIREWALL SECURITY SHIELD ================= -->
  <g transform="translate(400, 175)">
    <!-- Glow behind shield -->
    <circle r="35" fill="rgba(0, 242, 254, 0.15)" filter="url(#glow-cyan)" />
    
    <!-- Shield Graphic -->
    <path d="M 0 -28 C 14 -28 25 -24 28 -16 C 28 8 16 28 0 35 C -16 35 -28 8 -28 -16 C -25 -24 -14 -28 0 -28 Z" 
          fill="#0c192c" stroke="url(#shield-grad)" stroke-width="3" class="pulse-shield" />

    <!-- Shield Inner Circuit Detail -->
    <path d="M-10,-5 L0,5 L10,-5 M0,5 L0,-18" fill="none" stroke="#00f2fe" stroke-width="1.5" opacity="0.7" />
    
    <!-- Laser Scanner Line -->
    <g class="scan-line">
      <rect x="-35" y="-1" width="70" height="2" fill="url(#laser-grad)" />
      <line x1="-35" y1="0" x2="35" y2="0" stroke="#00f2fe" stroke-width="1" filter="url(#glow-cyan)" />
    </g>
    
    <text x="0" y="-36" text-anchor="middle" class="node-label" fill="#00f2fe">FIREWALL ENGINE</text>
  </g>


  <!-- ================= RIGHT: PROTECTED DESTINATIONS ================= -->
  <!-- Destination 1: Secure Memory Store (pgvector / Postgres) -->
  <g transform="translate(650, 115)">
    <!-- Outer Glow -->
    <rect x="-25" y="-25" width="50" height="50" rx="6" fill="#061f14" stroke="#22c55e" stroke-width="2" filter="url(#glow-green)" />
    <!-- DB / Cylinder Icon -->
    <path d="M-12,-10 C-12,-14 12,-14 12,-10 L12,10 C12,14 -12,14 -12,10 Z M-12,-10 C-12,-6 12,-6 12,-10 M-12,0 C-12,4 12,4 12,0" fill="none" stroke="#4ade80" stroke-width="1.8" />
    
    <text x="35" y="0" text-anchor="start" class="node-label" fill="#4ade80">Secure Memory</text>
    <text x="35" y="14" text-anchor="start" class="status-label" fill="#22c55e">ALLOWED</text>
  </g>

  <!-- Destination 2: Quarantine (Neo4j / Postgres / Dash) -->
  <g transform="translate(650, 235)">
    <!-- Outer Glow -->
    <rect x="-25" y="-25" width="50" height="50" rx="6" fill="#2a0f10" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)" />
    <!-- Lock / Hazard Icon -->
    <path d="M-8,-2 L8,-2 L8,10 L-8,10 Z M-5,-2 L-5,-7 C-5,-10 5,-10 5,-7 L5,-2" fill="none" stroke="#f87171" stroke-width="1.8" />
    <circle cx="0" cy="4" r="1.5" fill="#f87171" />
    
    <text x="35" y="0" text-anchor="start" class="node-label" fill="#f87171">Quarantine Log</text>
    <text x="35" y="14" text-anchor="start" class="status-label" fill="#ef4444">BLOCKED</text>
  </g>


  <!-- ================= ANIMATED MEMORY FLOW PACKETS ================= -->
  <!-- PACKET 1 (Web Scraper -> Firewall -> Secure Memory) -->
  <!-- Segment 1: Source 1 to Firewall (Cyan Packet) -->
  <circle r="4.5" fill="#38bdf8" filter="url(#glow-cyan)">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0s" path="M 150 115 L 400 175" keyTimes="0; 1" keySplines="0.4 0 0.2 1" calcMode="spline" />
  </circle>
  
  <!-- Segment 2: Firewall to Secure Memory (Green Packet) -->
  <circle r="5" fill="#4ade80" filter="url(#glow-green)">
    <animateMotion dur="3s" repeatCount="indefinite" begin="1.5s" path="M 400 175 L 650 115" keyTimes="0; 1" keySplines="0.1 0.8 0.3 1" calcMode="spline" />
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" begin="1.5s" keyTimes="0; 0.1; 0.9; 1" />
  </circle>

  <!-- PACKET 2 (Email -> Firewall -> Quarantine) -->
  <!-- Segment 1: Source 2 to Firewall (Purple Packet, represents suspicious data) -->
  <circle r="4.5" fill="#c084fc" filter="url(#glow-cyan)">
    <animateMotion dur="3s" repeatCount="indefinite" begin="1s" path="M 150 175 L 400 175" keyTimes="0; 1" keySplines="0.4 0 0.2 1" calcMode="spline" />
  </circle>
  
  <!-- Segment 2: Firewall to Quarantine (Red Packet) -->
  <circle r="5" fill="#f87171" filter="url(#glow-red)">
    <animateMotion dur="3s" repeatCount="indefinite" begin="2.5s" path="M 400 175 L 650 235" keyTimes="0; 1" keySplines="0.1 0.8 0.3 1" calcMode="spline" />
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" begin="2.5s" keyTimes="0; 0.1; 0.9; 1" />
  </circle>

  <!-- PACKET 3 (Tool Output -> Firewall -> Secure Memory) -->
  <!-- Segment 1: Source 3 to Firewall (Cyan Packet) -->
  <circle r="4.5" fill="#38bdf8" filter="url(#glow-cyan)">
    <animateMotion dur="3s" repeatCount="indefinite" begin="2s" path="M 150 235 L 400 175" keyTimes="0; 1" keySplines="0.4 0 0.2 1" calcMode="spline" />
  </circle>
  
  <!-- Segment 2: Firewall to Secure Memory (Green Packet) -->
  <circle r="5" fill="#4ade80" filter="url(#glow-green)">
    <animateMotion dur="3s" repeatCount="indefinite" begin="0.5s" path="M 400 175 L 650 115" keyTimes="0; 1" keySplines="0.1 0.8 0.3 1" calcMode="spline" />
    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite" begin="0.5s" keyTimes="0; 0.1; 0.9; 1" />
  </circle>

</svg>
