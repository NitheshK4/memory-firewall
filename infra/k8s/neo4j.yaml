apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-constraints
data:
  constraints.cypher: |
    // Memory Firewall – Neo4j constraints and indexes
    // Run once against a fresh database via: cypher-shell -f constraints.cypher

    // ── Uniqueness constraints ──────────────────────────────────────────────────
    CREATE CONSTRAINT memory_id_unique IF NOT EXISTS
        FOR (m:Memory) REQUIRE m.memory_id IS UNIQUE;

    CREATE INDEX source_type_idx IF NOT EXISTS FOR (s:Source) ON (s.source_type);
    CREATE INDEX source_actor_idx IF NOT EXISTS FOR (s:Source) ON (s.actor);

    CREATE CONSTRAINT claim_id_unique IF NOT EXISTS
        FOR (c:Claim) REQUIRE c.claim_id IS UNIQUE;



    // ── Indexes for lookup performance ─────────────────────────────────────────
    CREATE INDEX memory_status_idx IF NOT EXISTS FOR (m:Memory) ON (m.status);
    CREATE INDEX memory_trust_idx  IF NOT EXISTS FOR (m:Memory) ON (m.trust_score);
    CREATE INDEX claim_type_idx    IF NOT EXISTS FOR (c:Claim)  ON (c.claim_type);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  labels:
    app: neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: neo4j:5.22
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          env:
            - name: NEO4J_AUTH
              value: neo4j/password
          volumeMounts:
            - name: neo4j-data-vol
              mountPath: /data
      volumes:
        - name: neo4j-data-vol
          persistentVolumeClaim:
            claimName: neo4j-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
spec:
  ports:
    - port: 7474
      targetPort: 7474
      name: http
    - port: 7687
      targetPort: 7687
      name: bolt
  selector:
    app: neo4j
