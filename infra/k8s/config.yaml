apiVersion: v1
kind: ConfigMap
metadata:
  name: memory-firewall-config
data:
  USE_OPENAI: "false"
  OPENAI_MODEL: "gpt-4.1-mini"
  DATABASE_URL: "postgresql+psycopg://postgres:postgres@postgres:5432/memory_firewall"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USERNAME: "neo4j"
  NEO4J_PASSWORD: "password"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  API_BASE_URL: "http://api:8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: memory-firewall-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  API_KEY: ""
