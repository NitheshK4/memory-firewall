apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: infra-dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          # edited by Nithesh kumar on 2026-06-07
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 20
          envFrom:
            - configMapRef:
                name: memory-firewall-config
            - secretRef:
                name: memory-firewall-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
spec:
  type: LoadBalancer
  ports:
    - port: 8501
      targetPort: 8501
  selector:
    app: dashboard
