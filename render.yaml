services:
  # FastAPI Backend — in-memory store, no DB needed
  - type: web
    name: memory-firewall-api
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn apps.api.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: USE_OPENAI
        value: "false"
      - key: OPENAI_API_KEY
        value: ""
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: ""
      - key: NEO4J_URI
        value: ""
